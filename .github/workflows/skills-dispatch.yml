name: Skills dispatch

# After a push to main that changes a skill, asks every repository with a Skills workflow
# (.github/workflows/skills.yml, which calls the shared skills.yml) to copy the skills again. A new
# one is added to `repositories`.
on:
  push:
    branches: [main]
    paths: ['skills/**']

permissions: {}

concurrency:
  group: skills-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-slim
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
          repositories: builder,catalog,design-system,identity,website,zeabur
          permission-contents: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api --paginate /installation/repositories --jq '.repositories[].name' \
            | while read -r repo; do
                gh api --silent "repos/$OWNER/$repo/dispatches" -f event_type=zeabur-oss-skills
                echo "$repo"
              done

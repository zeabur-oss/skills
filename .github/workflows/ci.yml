name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job is in scripts/ci.sh (`scripts/ci.sh --list`); the shared workflow only checks out
  # and installs Nix.
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@0c71bf4017582c7cabe03d79842254694964a385 # main
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@0c71bf4017582c7cabe03d79842254694964a385 # main

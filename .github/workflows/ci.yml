name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job is in scripts/ci.sh (`scripts/ci.sh --list`); the shared workflow only checks out
  # and installs Nix.
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@07053982f99078683ff95ebb5003d5223420aa2e # main
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@07053982f99078683ff95ebb5003d5223420aa2e # main
